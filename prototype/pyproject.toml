[project]
name = "mflog-proto"
version = "0.1.0"
description = "Technology validation prototype for MF-LOG-ANALYZER v2"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "polars>=1.0",
  "PySide6>=6.8",
  "pyqtgraph>=0.13",
  "psutil>=5.9",
  "PyYAML>=6.0",
]

[project.scripts]
mflog-proto-bench = "mflog_proto.benchmark.runner:main"
mflog-proto-generate = "mflog_proto.data.synthetic_log:main"
mflog-proto-ui = "mflog_proto.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-qt>=4.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
